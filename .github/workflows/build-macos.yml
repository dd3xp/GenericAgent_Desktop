name: Build macOS Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - ci/macos-build
    tags:
      - "v*"

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontends/desktop/src-tauri -> target

      - name: Install desktop dependencies
        working-directory: frontends/desktop
        run: npm install

      - name: Build Tauri macOS DMG
        working-directory: frontends/desktop
        run: npm run tauri build -- --bundles dmg

      - name: Create portable zip with app and source
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="frontends/desktop/src-tauri/target/release/bundle/macos/GenericAgent.app"
          PORTABLE_DIR="dist/GenericAgent-macos-portable"
          ZIP_PATH="dist/GenericAgent-macos-portable.zip"

          test -d "$APP_PATH"
          rm -rf dist
          mkdir -p "$PORTABLE_DIR/source"

          # Preserve macOS app bundle metadata/resource forks.
          ditto "$APP_PATH" "$PORTABLE_DIR/GenericAgent.app"

          # Include source code, but exclude VCS data and build/dependency caches.
          rsync -a ./ "$PORTABLE_DIR/source/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='frontends/desktop/node_modules/' \
            --exclude='frontends/desktop/package-lock.json' \
            --exclude='frontends/desktop/src-tauri/target/' \
            --exclude='frontends/desktop/src-tauri/gen/'

          cat > "$PORTABLE_DIR/README-portable-macos.txt" <<'EOF'
GenericAgent macOS Portable

解压后可直接双击 GenericAgent.app 运行。
source/ 目录包含对应源码。

如果 macOS 提示无法打开，可执行：
  xattr -cr GenericAgent.app
EOF

          ditto -c -k --sequesterRsrc --keepParent "$PORTABLE_DIR" "$ZIP_PATH"
          ls -lh dist

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenericAgent-macos-dmg
          path: frontends/desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenericAgent-macos-portable-zip
          path: dist/GenericAgent-macos-portable.zip
