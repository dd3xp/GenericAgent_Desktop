name: Build macOS Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - ci/macos-build
    tags:
      - "v*"

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontends/desktop/src-tauri -> target

      - name: Install desktop dependencies
        working-directory: frontends/desktop
        run: npm install

      - name: Build Tauri macOS DMG
        working-directory: frontends/desktop
        run: npm run tauri build -- --bundles dmg

      - name: Create portable zip with app and source
        shell: bash
        run: |
          set -euo pipefail
          PORTABLE_DIR="dist/GenericAgent-macos-portable"
          ZIP_PATH="dist/GenericAgent-macos-portable.zip"

          echo "Looking for built .app bundle..."
          find frontends/desktop/src-tauri/target/release -maxdepth 5 -name '*.app' -type d -print
          APP_PATH="$(find frontends/desktop/src-tauri/target/release -maxdepth 5 -name 'GenericAgent.app' -type d -print -quit)"
          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(find frontends/desktop/src-tauri/target/release -maxdepth 5 -name '*.app' -type d -print -quit)"
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: no .app bundle found under target/release" >&2
            find frontends/desktop/src-tauri/target/release -maxdepth 4 -type d -print >&2
            exit 1
          fi
          echo "Using app bundle: $APP_PATH"

          rm -rf dist
          mkdir -p "$PORTABLE_DIR/source"

          # Preserve macOS app bundle metadata/resource forks.
          ditto "$APP_PATH" "$PORTABLE_DIR/GenericAgent.app"

          # Include tracked source code only. This avoids copying VCS data,
          # build outputs, dependency caches, and the dist directory.
          git archive --format=tar HEAD | tar -x -C "$PORTABLE_DIR/source"
          rm -rf "$PORTABLE_DIR/source/.github"

          printf '%s\n' \
            'GenericAgent macOS Portable' \
            '' \
            '解压后可直接双击 GenericAgent.app 运行。' \
            'source/ 目录包含对应源码。' \
            '' \
            '如果 macOS 提示无法打开，可执行：' \
            '  xattr -cr GenericAgent.app' \
            > "$PORTABLE_DIR/README-portable-macos.txt"

          ditto -c -k --sequesterRsrc --keepParent "$PORTABLE_DIR" "$ZIP_PATH"
          ls -lh dist

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenericAgent-macos-dmg
          path: frontends/desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenericAgent-macos-portable-zip
          path: dist/GenericAgent-macos-portable.zip
